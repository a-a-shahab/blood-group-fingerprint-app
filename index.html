<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Group Detection</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px;}
        .result { font-size: 24px; font-weight: bold; margin-top: 20px; color: #28a745; }
        hr { margin: 30px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Blood Group Prediction via Fingerprint</h2>
        
        <!-- Option 1: File Upload -->
        <h3>Option 1: Upload Image (JPG/PNG/BMP)</h3>
        <input type="file" id="imageInput" accept=".jpg, .jpeg, .png, .bmp">
        <br><br>
        <button class="btn" onclick="uploadImage()">Predict from File</button>
        
        <hr>

        <!-- Option 2: ESP32 Hardware Integration -->
        <h3>Option 2: AS608 Hardware Sensor</h3>
        <p>Scan your finger on the AS608 sensor connected to the ESP32.</p>
        <button class="btn" style="background:#17a2b8;" onclick="pollESP32()">Check Sensor Result</button>

        <div class="result" id="resultText"></div>
    </div>

    <script>
        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) {
                alert('Please select an image first.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            document.getElementById('resultText').innerText = "Processing...";

            const response = await fetch('/predict', { method: 'POST', body: formData });
            const data = await response.json();
            
            if (data.blood_group) {
                document.getElementById('resultText').innerText = "Predicted Blood Group: " + data.blood_group;
            } else {
                document.getElementById('resultText').innerText = "Error: " + data.error;
            }
        }

        async function pollESP32() {
            document.getElementById('resultText').innerText = "Checking server for sensor data...";
            const response = await fetch('/get_esp32_result');
            const data = await response.json();
            document.getElementById('resultText').innerText = "Sensor Status: " + data.blood_group;
        }
    </script>
</body>
</html>
